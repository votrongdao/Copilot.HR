<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PopUp Form - Add New Employee</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #09090b;
            --bg-card: #ffffff;
            --text-main: #09090b;
            --text-muted: #71717a;
            --border-color: #e4e4e7;
            --border-strong: #18181b;
            --radius-md: 10px;
            --radius-lg: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f4f4f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            width: 580px;
            max-width: 95vw;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title { font-size: 16px; font-weight: 700; color: var(--text-main); }
        .modal-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text-main); }
        .form-control {
            padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-color);
            font-size: 13px; outline: none; background: #fafafa;
        }

        .modal-footer {
            padding: 18px 24px; border-top: 1px solid var(--border-color);
            display: flex; justify-content: flex-end; gap: 12px; background: #fafafa;
        }

        .btn-cancel { padding: 10px 18px; border-radius: var(--radius-md); border: 1px solid var(--border-color); background: white; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-submit { padding: 10px 20px; border-radius: var(--radius-md); border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; font-size: 13px; }
    </style>
</head>

<body>
    <div class="modal-card">
        <div class="modal-header">
            <h2 class="modal-title">Add New Employee Profile</h2>
        </div>

        <div class="modal-body">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" class="form-control" placeholder="e.g. Nguyen Van An">
                </div>
                <div class="form-group">
                    <label>Employee ID Code *</label>
                    <input type="text" class="form-control" placeholder="EMP-8025" value="EMP-8025">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Corporate Email *</label>
                    <input type="email" class="form-control" placeholder="an.nguyen@hrplatform.com">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" class="form-control" placeholder="+84 912 345 678">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Department *</label>
                    <select class="form-control">
                        <option>Human Resources</option>
                        <option selected>Technology & Software</option>
                        <option>System Administration</option>
                        <option>Finance & Accounting</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Job Title / Role *</label>
                    <input type="text" class="form-control" placeholder="e.g. Senior Backend Engineer">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Contract Type *</label>
                    <select class="form-control">
                        <option>Indefinite Permanent</option>
                        <option>Definite Fixed Term (1 Year)</option>
                        <option>Probationary Contract</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Work Location</label>
                    <select class="form-control">
                        <option>Headquarters (HCMC)</option>
                        <option>Hanoi Branch</option>
                        <option>Remote Workforce</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel">Cancel</button>
            <button class="btn-submit">Create Employee Profile</button>
        </div>
    </div>
</body>

</html>
