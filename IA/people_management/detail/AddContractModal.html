<!-- Add New Contract Modal Component -->
<div class="modal-backdrop">
    <div class="modal-box">
        <h3>Add New Labor Contract</h3>
        <p style="font-size:13px; color:#71717a; margin-bottom:16px;">Create a new labor contract record for employee.</p>
        <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:600;">Contract Type *</label>
            <select style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
                <option>Indefinite Term Contract</option>
                <option>Fixed-term (12 Months)</option>
                <option>Fixed-term (24 Months)</option>
                <option>Probation Contract (2 Months)</option>
            </select>
        </div>
        <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:600;">Start Date *</label>
            <input type="date" value="2026-01-01" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
        </div>
        <div class="form-group" style="margin-bottom:12px;">
            <label style="font-size:12px; font-weight:600;">Base Salary ($) *</label>
            <input type="number" value="3200" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
            <button class="btn-wireframe">Cancel</button>
            <button class="btn-primary" style="background:#09090b; color:#fff; padding:8px 16px; border-radius:6px;">Create Contract</button>
        </div>
    </div>
</div>
