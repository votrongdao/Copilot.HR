<!-- Export Employee Data Modal Component -->
<div class="modal-backdrop">
    <div class="modal-box">
        <h3>Export Employee Directory Data</h3>
        <p style="font-size:13px; color:#71717a; margin-bottom:16px;">Select fields and file format to export.</p>
        <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">
            <label style="font-size:12.5px;"><input type="checkbox" checked> Personal & Contact Info</label>
            <label style="font-size:12.5px;"><input type="checkbox" checked> Department & Job Title</label>
            <label style="font-size:12.5px;"><input type="checkbox" checked> Contract & Compensation</label>
            <label style="font-size:12.5px;"><input type="checkbox"> Attendance & Leave Balance</label>
        </div>
        <div class="form-group" style="margin-bottom:16px;">
            <label style="font-size:12px; font-weight:600;">File Format:</label>
            <select style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
                <option>CSV (.csv)</option>
                <option>Excel Workbook (.xlsx)</option>
            </select>
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn-wireframe">Cancel</button>
            <button class="btn-primary" style="background:#09090b; color:#fff; padding:8px 16px; border-radius:6px;">Download Export</button>
        </div>
    </div>
</div>
