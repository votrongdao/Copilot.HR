<!-- Edit Position Drawer Component -->
<div class="drawer-header">
    <h2>Edit Position & Salary Band</h2>
</div>
<div class="drawer-body">
    <div class="form-group" style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:600;">Position Job Title *</label>
        <input type="text" value="Senior Software Engineer" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:600;">Job Level *</label>
        <select style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
            <option>Junior (L2)</option>
            <option>Mid-Level (L3)</option>
            <option selected>Senior (L4)</option>
            <option>Lead / Principal (L5)</option>
        </select>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:600;">Salary Band Minimum ($) *</label>
        <input type="number" value="2500" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:600;">Salary Band Maximum ($) *</label>
        <input type="number" value="4000" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
    </div>
    <button style="background:#09090b; color:#fff; padding:10px 18px; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Update Position</button>
</div>
