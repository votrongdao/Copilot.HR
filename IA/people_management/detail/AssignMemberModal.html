<!-- Assign Member Modal Component -->
<div class="modal-backdrop">
    <div class="modal-box">
        <h3>Assign Employee to Team</h3>
        <p style="font-size:13px; color:#71717a; margin-bottom:16px;">Add members to Frontend Core Engineering Team.</p>
        <div class="form-group">
            <label style="font-size:12px; font-weight:600;">Search Member:</label>
            <input type="text" placeholder="Type employee name or ID..." style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
        </div>
        <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
            <button class="btn-wireframe">Cancel</button>
            <button class="btn-primary" style="background:#09090b; color:#fff; padding:8px 16px; border-radius:6px;">Add to Team</button>
        </div>
    </div>
</div>
