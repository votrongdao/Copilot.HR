<!-- Edit Team Drawer Component -->
<div class="drawer-header">
    <h2>Edit Team Settings</h2>
</div>
<div class="drawer-body">
    <div class="form-group" style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:600;">Team Name *</label>
        <input type="text" value="Frontend Core Engineering" style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
    </div>
    <div class="form-group" style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:600;">Department *</label>
        <select style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
            <option selected>Technology & Software</option>
            <option>Human Resources</option>
            <option>Product & Design</option>
        </select>
    </div>
    <div class="form-group" style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:600;">Team Lead *</label>
        <select style="width:100%; padding:8px; border-radius:6px; border:1px solid #e4e4e7;">
            <option selected>Duong Vo Duy Khang</option>
            <option>Mark Vance</option>
            <option>Emily Chen</option>
        </select>
    </div>
    <button style="background:#09090b; color:#fff; padding:10px 18px; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Save Team Changes</button>
</div>
